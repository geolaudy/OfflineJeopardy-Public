# Checks for a release pull request into main (BRANCH_WORKFLOW.md): type check and unit/integration
# tests on Windows. Can also be started by hand. Packaging and publishing stay in windows-build.yml
# (version tags only); nothing here merges or publishes anything.
name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

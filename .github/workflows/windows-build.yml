# Windows build: tests, packages and verifies the installer + portable exe.
# - Runs on version tags (v1.2.3) and publishes a GitHub Release with the changelog section and both
#   executables attached.
# - Can be started by hand (Actions → Windows build → Run workflow) to get the artifacts without a
#   release. Ordinary pushes do not trigger it.
name: Windows build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build; no certificate in CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Verify packages (contents + headless start of both executables)
        run: node scripts/verify-dist.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineJeopardy-windows-${{ github.ref_name }}
          path: |
            release/OfflineJeopardy-Setup-*.exe
            release/OfflineJeopardy-Portable-*.exe
            release/SHA256SUMS.txt
            release/verify-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.mjs ${{ github.ref_name }} > release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OfflineJeopardy ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/OfflineJeopardy-Setup-*.exe
            release/OfflineJeopardy-Portable-*.exe
            release/SHA256SUMS.txt

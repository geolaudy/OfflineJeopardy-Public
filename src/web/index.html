<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- R11-7: an installable web app ("Add to Home Screen") that keeps every page of the app — not
         just the one it was added from — in its own window (scope "/"). The player pages swap in
         their own manifest (App.tsx) so a phone's icon opens the player portal. -->
    <link rel="manifest" href="/host.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OJ Host" />
    <!-- R15-31 (K55): "black-translucent" is the only style that lets the page's own colour show
         behind the status bar of a Home Screen web app ("default" is an opaque white bar the page
         cannot colour). The page paints that area navy (styles.css, standalone only). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1437" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OfflineJeopardy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
